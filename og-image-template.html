<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: white -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- VS badge — large, centered -->
  <rect x="526" y="140" width="148" height="148" rx="32" fill="#533afd"/>
  <text x="600" y="244" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#ffffff" text-anchor="middle">VS</text>

  <!-- Brand name -->
  <text x="600" y="348" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="36" fill="#060f1f" text-anchor="middle" letter-spacing="-1">Voice Survey</text>

  <!-- Tagline -->
  <text x="600" y="406" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#888888" text-anchor="middle">AI가 인터뷰하고, AI가 분석합니다</text>

  <!-- Bottom accent line -->
  <rect x="560" y="470" width="80" height="3" rx="2" fill="#533afd"/>
</svg>
</body>
</html>
