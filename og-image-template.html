<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #ffffff; font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Background: white -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Subtle top-left purple accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#533afd"/>

  <!-- VS badge -->
  <rect x="72" y="68" width="48" height="48" rx="10" fill="#533afd"/>
  <text x="96" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">VS</text>

  <!-- Wordmark -->
  <text x="72" y="308" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="112" letter-spacing="-4" fill="#060f1f">Voice</text>
  <text x="396" y="308" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="112" letter-spacing="-4" fill="#533afd">Survey</text>

  <!-- Price-focused tagline -->
  <text x="72" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="500" font-size="36" fill="#333333" letter-spacing="-0.5">기존 인터뷰 비용의 10분의 1</text>

  <!-- Sub message -->
  <text x="72" y="448" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#888888">AI가 수백 명을 동시에 인터뷰하고, 분석까지 끝냅니다</text>

  <!-- Divider -->
  <rect x="72" y="516" width="160" height="2" rx="1" fill="#533afd"/>

  <!-- Domain -->
  <text x="72" y="574" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#aaaaaa">voicesurvey.ai</text>

</svg>
</body>
</html>
