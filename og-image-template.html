<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="25%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#1a0f50"/>
      <stop offset="100%" stop-color="#060f1f"/>
    </radialGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#533afd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#533afd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f96bee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f96bee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#533afd"/>
      <stop offset="100%" stop-color="#f96bee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glow orbs -->
  <ellipse cx="280" cy="380" rx="420" ry="340" fill="url(#glowL)"/>
  <ellipse cx="960" cy="180" rx="320" ry="260" fill="url(#glowR)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="630" fill="url(#accent)"/>

  <!-- VS badge -->
  <rect x="80" y="88" width="48" height="48" rx="12" fill="#533afd"/>
  <text x="104" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">VS</text>
  <!-- Brand label -->
  <text x="142" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="500" font-size="18" fill="rgba(255,255,255,0.4)">Voice Survey</text>

  <!-- Main headline -->
  <text x="80" y="288" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="100" letter-spacing="-4" fill="#ffffff">AI 음성</text>
  <text x="80" y="388" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="100" letter-spacing="-4" fill="#533afd">인터뷰</text>

  <!-- Tagline -->
  <text x="80" y="452" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="rgba(255,255,255,0.55)" letter-spacing="-0.3">수백 명 동시 인터뷰 · 비용 10분의 1 · 10분 분석</text>

  <!-- Divider -->
  <rect x="80" y="508" width="120" height="3" rx="2" fill="url(#accent)"/>

  <!-- Domain -->
  <text x="80" y="558" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.25)">voicesurvey.ai</text>

  <!-- Right: mock interview card -->
  <g transform="translate(740, 100)">
    <!-- Card glow -->
    <rect x="8" y="8" width="372" height="260" rx="20" fill="rgba(83,58,253,0.15)"/>
    <!-- Card body -->
    <rect width="372" height="260" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Card header row -->
    <circle cx="36" cy="38" r="18" fill="linear-gradient(135deg,#1a73e8,#e8710a)"/>
    <rect x="18" y="20" width="36" height="36" rx="18" fill="rgba(26,115,232,0.3)"/>
    <text x="36" y="44" font-family="Inter, sans-serif" font-size="16" fill="#b9b9f9" text-anchor="middle" font-weight="700">✦</text>
    <text x="65" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.35)">AI 인터뷰어  ·  Voice Survey</text>
    <text x="354" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.2)" text-anchor="end">Q1 / 12</text>

    <!-- Question text placeholder lines -->
    <rect x="20" y="78" width="310" height="11" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="20" y="100" width="270" height="11" rx="6" fill="rgba(255,255,255,0.12)"/>
    <rect x="20" y="122" width="200" height="11" rx="6" fill="rgba(255,255,255,0.08)"/>

    <!-- Mic button area -->
    <circle cx="50" cy="200" r="26" fill="rgba(26,115,232,0.2)" stroke="rgba(26,115,232,0.35)" stroke-width="1.5"/>
    <!-- Mic icon (SVG path) -->
    <rect x="44" y="188" width="12" height="18" rx="6" fill="rgba(185,185,249,0.8)"/>
    <path d="M38 204 Q38 218 50 218 Q62 218 62 204" stroke="rgba(185,185,249,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="50" y1="218" x2="50" y2="226" stroke="rgba(185,185,249,0.5)" stroke-width="2"/>
    <text x="88" y="205" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.3)">버튼을 눌러 답변해 주세요</text>
  </g>

  <!-- Right: wave bars -->
  <g transform="translate(754, 400)" opacity="0.5">
    <rect x="0"   y="24" width="10" height="28" rx="5" fill="#533afd"/>
    <rect x="18"  y="12" width="10" height="52" rx="5" fill="#533afd"/>
    <rect x="36"  y="4"  width="10" height="68" rx="5" fill="#6b54ff"/>
    <rect x="54"  y="16" width="10" height="44" rx="5" fill="#533afd"/>
    <rect x="72"  y="28" width="10" height="20" rx="5" fill="#533afd"/>
    <rect x="90"  y="18" width="10" height="40" rx="5" fill="#7c6bff"/>
    <rect x="108" y="8"  width="10" height="60" rx="5" fill="#533afd"/>
    <rect x="126" y="22" width="10" height="32" rx="5" fill="#533afd"/>
    <rect x="144" y="14" width="10" height="48" rx="5" fill="#6b54ff"/>
    <rect x="162" y="30" width="10" height="16" rx="5" fill="#533afd"/>
  </g>
</svg>
</body>
</html>
