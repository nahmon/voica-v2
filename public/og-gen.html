<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #ffffff;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .logo-icon {
    width: 140px;
    height: 140px;
    border-radius: 36px;
    background: #6E4BFF;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .logo-icon-inner {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    background: white;
  }
  .logo-name {
    font-size: 96px;
    font-weight: 700;
    color: #061b31;
    letter-spacing: -3px;
    line-height: 1;
  }
  .logo-name span {
    color: #6E4BFF;
  }
</style>
</head>
<body>
  <div class="logo-row">
    <div class="logo-icon">
      <div class="logo-icon-inner"></div>
    </div>
    <div class="logo-name">voice<span>survey</span></div>
  </div>
</body>
</html>
