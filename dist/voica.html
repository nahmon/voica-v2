function Badge({ children, variant = "neutral", style: sx = {} }) {
  const v = {
    neutral: { background: C.gray, color: C.black, border: "none" },
    purple: { background: C.blueBg, color: C.blue, border: "none" },
    ai: { background: C.blueBg, color: C.blue, border: "none" },
    success: { background: C.successBg, color: C.successText, border: "none" },
    negative: { background: "rgba(255,59,48,0.08)", color: C.ruby, border: "none" },
    warning: { background: "rgba(255,159,10,0.1)", color: "#92650a", border: "none" },
    dark: { background: "rgba(255,255,255,0.08)", color: "rgba(255,255,255,0.7)", border: "none" },
  };
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "4px 10px", borderRadius: 980, fontSize: 12, fontWeight: 400, fontFamily: F, letterSpacing: -0.12, whiteSpace: "nowrap", ...v[variant], ...sx }}>{children}</span>;
}

function Btn({ children, variant = "primary", size = "md", onClick, disabled, full, style: sx = {} }) {
  const [hov, setHov] = useState(false);
  const sz = {
    sm: { padding: "6px 14px", fontSize: 14, letterSpacing: -0.224 },
    md: { padding: "8px 16px", fontSize: 17, letterSpacing: -0.374 },
    lg: { padding: "12px 28px", fontSize: 17, letterSpacing: -0.374 },
  };
  const vr = {
    primary: { background: disabled ? "rgba(0,113,227,0.4)" : hov ? C.blueHover : C.blue, color: C.white, border: "none" },
    ghost: { background: "transparent", color: hov ? C.blueHover : C.blueDeep, border: `1px solid ${C.blueDeep}`, borderRadius: 980 },
    dark: { background: hov ? "#333" : C.black, color: C.white, border: "none" },
    white: { background: hov ? "rgba(255,255,255,0.85)" : C.white, color: C.black, border: "none" },
    kakao: { background: hov ? "#e6c200" : "#FEE500", color: "#191919", border: "none" },
    naver: { background: hov ? "#02b351" : "#03C75A", color: C.white, border: "none" },
    toss: { background: hov ? "#0057e0" : "#0064FF", color: C.white, border: "none" },
    naverpay: { background: hov ? "#02b351" : "#03C75A", color: C.white, border: "none" },
    tossspay: { background: hov ? "#0057e0" : "#0064FF", color: C.white, border: "none" },
    stripe: { background: hov ? "#5851d8" : "#635bff", color: C.white, border: "none" },
  };
  return (
    <button disabled={disabled} onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 7, borderRadius: 8, cursor: disabled ? "not-allowed" : "pointer", fontFamily: F, fontWeight: 400, transition: "all 0.18s", width: full ? "100%" : "auto", lineHeight: 1, ...sz[size], ...vr[variant], ...sx }}>
      {children}
    </button>
  );
}

function PillLink({ children, onClick, dark = false, style: sx = {} }) {
  const [hov, setHov] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "transparent", border: `1px solid ${dark ? C.white : C.blueDeep}`, borderRadius: 980, padding: "8px 20px", fontSize: 14, fontFamily: F, fontWeight: 400, color: dark ? C.white : C.blueDeep, cursor: "pointer", textDecoration: hov ? "underline" : "none", transition: "all 0.15s", letterSpacing: -0.224, ...sx }}>
      {children}
    </button>
  );
}

function NavTab({ label, onClick, active }) {
  const [hov, setHov] = useState(false);
  return (
    <button onClick={onClick}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ display: "flex", alignItems: "center", padding: "0 14px", fontSize: 12, fontFamily: F, fontWeight: 400, color: active ? C.white : hov ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.7)", background: "transparent", border: "none", cursor: "pointer", transition: "color 0.15s", whiteSpace: "nowrap", letterSpacing: -0.12, textDecoration: hov ? "underline" : "none" }}>
      {label}
    </button>
  );
}

function Input({ label, type = "text", placeholder, value, onChange, helper }) {
  const [focused, setFocused] = useState(false);
  return (
    <div>
      {label && <label style={{ display: "block", fontSize: 14, fontWeight: 400, color: C.black, marginBottom: 6, fontFamily: F, letterSpacing: -0.224 }}>{label}</label>}
      <input
        type={type} placeholder={placeholder} value={value} onChange={onChange}
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${focused ? C.blue : C.border}`, fontSize: 17, fontFamily: F, color: C.black, outline: "none", boxSizing: "border-box", background: C.white, transition: "border-color 0.15s", boxShadow: focused ? `0 0 0 3px ${C.blueBg}` : "none", letterSpacing: -0.374 }}
      />
      {helper && <div style={{ fontSize: 12, color: C.body, marginTop: 4, fontFamily: F, letterSpacing: -0.12 }}>{helper}</div>}
    </div>
  );
}

function Divider({ label }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "4px 0" }}>
      <div style={{ flex: 1, height: 1, background: C.border }} />
      <span style={{ fontSize: 12, color: C.body, fontFamily: F, letterSpacing: -0.12 }}>{label}</span>
      <div style={{ flex: 1, height: 1, background: C.border }} />
    </div>
  );
}

function BackBtn({ onClick, label = "홈으로", dark = false }) {

      {label}
    </button>
  );
}

// Apple-style V mark — monochrome
function VoicaMark({ size = 20, light = false }) {
  return (
    <svg width={Math.round(size * 0.9)} height={size} viewBox="0 0 30 30" fill="none" style={{ flexShrink: 0, display: "block" }}>
      <path
        fillRule="evenodd"
        fill={light ? "#ffffff" : C.black}
        d="M 0,0 L 30,0 L 15,30 Z M 9,0 L 21,0 L 15,23 Z"
      />
    </svg>
  );
}

          ))}
        </div>

        {/* Projects */}
        <div style={{ marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: 17, fontWeight: 600, color: C.black, letterSpacing: -0.374 }}>프로젝트</div>
          <a href="#" style={{ fontSize: 14, color: C.blueDeep, textDecoration: "none", letterSpacing: -0.224 }}>전체 보기 ›</a>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {PROJECTS.map(p => {
            const pct = Math.round((p.done / p.goal) * 100);
            const st = statusStyle[p.status];
            return (
              <div key={p.id} onClick={() => go(p.status === "완료" ? "report" : "editor")} style={{ background: C.white, borderRadius: 12, padding: "20px 24px", cursor: "pointer", transition: "all 0.2s", display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}
                onMouseEnter={e => e.currentTarget.style.background = "#ececf0"}
                onMouseLeave={e => e.currentTarget.style.background = C.white}>
                <div style={{ flex: 1, minWidth: 180 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                    <span style={{ fontSize: 17, fontWeight: 600, color: C.black, letterSpacing: -0.374 }}>{p.name}</span>
                    <Badge variant={st.variant}>{p.status}</Badge>
                  </div>
                  <div style={{ fontSize: 14, color: C.body, letterSpacing: -0.224 }}>질문 {p.questions}개 · {p.date}</div>
                </div>
                <div style={{ minWidth: 160 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ fontSize: 12, color: C.body, letterSpacing: -0.12 }}>패널 달성률</span>
                    <span style={{ fontSize: 12, fontWeight: 600, color: pct >= 100 ? C.successText : C.black, letterSpacing: -0.12 }}>{p.done}/{p.goal}명</span>
                  </div>
                  <div style={{ height: 4, background: C.gray, borderRadius: 2 }}>
                    <div style={{ height: "100%", width: `${pct}%`, background: pct >= 100 ? C.success : C.blue, borderRadius: 2, transition: "width 0.5s" }} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  {p.status !== "완료" && <PillLink onClick={e => { e.stopPropagation(); go("editor"); }} style={{ fontSize: 12, padding: "4px 14px" }}>편집</PillLink>}
                  {p.themes > 0 && <Btn size="sm" onClick={e => { e.stopPropagation(); go("report"); }} style={{ borderRadius: 980, fontSize: 12, padding: "4px 14px" }}>리포트</Btn>}
                </div>
              </div>
            );
          })}
        </div>
      </main>
    </div>
  );
}

// ─── SCREEN: 패널 등록 ───
function PanelEntryScreen({ go }) {

  const AGES = ["10대", "20대", "30대", "40대", "50대", "60대 이상"];
  const JOBS = ["직장인 (대기업/중견)", "직장인 (중소기업)", "프리랜서/자영업", "전문직 (의사·변호사·회계사 등)", "공무원/공기업", "학생", "주부", "구직 중", "기타"];
  const INCOMES = ["없음", "100만원 미만", "100~300만원", "300~500만원", "500~700만원", "700만원 이상", "응답 안 함"];

  const STEPS = ["기본 정보", "매칭 프로필", "동의 및 완료"];

  function FieldLabel({ children }) {
    return <label style={{ display: "block", fontSize: 14, fontWeight: 600, color: C.black, marginBottom: 8, fontFamily: F, letterSpacing: -0.224 }}>{children}</label>;
  }
  function ChipGroup({ options, value, onSelect, multi }) {
    return (
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        {options.map(o => {
          const active = multi ? value.includes(o) : value === o;
          return (
            <button key={o} onClick={() => onSelect(o)}
              style={{ padding: "8px 14px", borderRadius: 980, fontSize: 14, fontFamily: F, cursor: "pointer", border: "none", background: active ? C.blue : C.gray, color: active ? C.white : C.black, transition: "all 0.15s", fontWeight: 400, letterSpacing: -0.224 }}>

  }

  function StepBar() {
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 0, marginBottom: 32 }}>

          <div style={{ background: C.white, borderRadius: 12, padding: "28px", display: "flex", flexDirection: "column", gap: 22 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
              <Input label="이름 (실명)" placeholder="홍길동" value={form.name} onChange={e => upd("name", e.target.value)} />
              <Input label="연락처" type="tel" placeholder="010-0000-0000" value={form.phone} onChange={e => upd("phone", e.target.value)} />
            </div>
            <div><FieldLabel>거주 지역</FieldLabel><ChipGroup options={REGIONS} value={form.region} onSelect={v => upd("region", v)} /></div>
            <div><FieldLabel>성별</FieldLabel><ChipGroup options={GENDERS} value={form.gender} onSelect={v => upd("gender", v)} /></div>
            <div><FieldLabel>연령대</FieldLabel><ChipGroup options={AGES} value={form.age} onSelect={v => upd("age", v)} /></div>
            <Btn full size="lg" disabled={!step0Valid} onClick={() => setStep(1)} style={{ borderRadius: 980 }}>다음</Btn>
          </div>
        </div>
      </div>
    </div>
  );

  if (step === 1) return (
    <div style={{ minHeight: "100vh", background: C.gray, fontFamily: F }}>
      {navBar}
      <div style={{ display: "flex", justifyContent: "center", padding: "40px 24px" }}>
        <div style={{ width: "100%", maxWidth: 520 }}>
          <StepBar />
          <div style={{ textAlign: "center", marginBottom: 28 }}>
            <div style={{ fontSize: 28, fontWeight: 600, color: C.black, letterSpacing: -0.56, lineHeight: 1.14, marginBottom: 8 }}>매칭 프로필을 설정해 주세요</div>
            <div style={{ fontSize: 17, color: C.body, letterSpacing: -0.374 }}>리서처가 적합한 패널을 선택할 때 활용됩니다</div>
          </div>
          <div style={{ background: C.white, borderRadius: 12, padding: "28px", display: "flex", flexDirection: "column", gap: 24 }}>
            <div><FieldLabel>직업</FieldLabel><ChipGroup options={JOBS} value={form.job} onSelect={v => upd("job", v)} /></div>
            <div><FieldLabel>월 소득</FieldLabel><ChipGroup options={INCOMES} value={form.income} onSelect={v => upd("income", v)} /></div>
            <div>
              <FieldLabel>전문분야 / 관심분야 <span style={{ fontWeight: 400, color: C.body }}>(복수 선택)</span></FieldLabel>
              <ChipGroup options={INTERESTS} value={form.interests} onSelect={toggleInterest} multi />
              {form.interests.length > 0 && <div style={{ marginTop: 10, fontSize: 14, color: C.blue, letterSpacing: -0.224 }}>{form.interests.length}개 선택됨</div>}
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <PillLink onClick={() => setStep(0)} style={{ flex: 1 }}>이전</PillLink>
              <Btn size="lg" style={{ flex: 2, borderRadius: 980 }} disabled={!step1Valid} onClick={() => setStep(2)}>다음</Btn>
            </div>
          </div>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: C.gray, fontFamily: F }}>
      {navBar}
      <div style={{ display: "flex", justifyContent: "center", padding: "40px 24px" }}>
        <div style={{ width: "100%", maxWidth: 520 }}>
          <StepBar />
          <div style={{ textAlign: "center", marginBottom: 28 }}>
            <div style={{ fontSize: 28, fontWeight: 600, color: C.black, letterSpacing: -0.56, lineHeight: 1.14, marginBottom: 8 }}>개인정보 수집 및 이용 동의</div>
            <div style={{ fontSize: 17, color: C.body, letterSpacing: -0.374 }}>아래 내용을 확인하고 동의해 주세요</div>
          </div>
          <div style={{ background: C.white, borderRadius: 12, padding: "28px" }}>
            <div style={{ background: C.blueBg, borderRadius: 8, padding: "14px 16px", marginBottom: 20 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.blue, marginBottom: 8, letterSpacing: -0.12 }}>입력하신 프로필 요약</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 16px" }}>
                {[["이름", form.name], ["지역", form.region], ["연령/성별", `${form.age} · ${form.gender}`], ["직업", form.job], ["월 소득", form.income], ["관심분야", form.interests.slice(0, 3).join(", ") + (form.interests.length > 3 ? ` 외 ${form.interests.length - 3}개` : "")]].map(([k, v]) => (

              <div style={{ fontSize: 14, color: C.body, lineHeight: 1.75, letterSpacing: -0.224 }}>

                개인 식별 정보는 광고주에게 공유되지 않습니다<br />
                동의 철회 시 언제든 탈퇴 가능합니다
              </div>
            </div>
            <div onClick={() => setAgreed(a => !a)} style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 20, cursor: "pointer" }}>
              <div style={{ width: 20, height: 20, borderRadius: 4, border: `1.5px solid ${agreed ? C.blue : "rgba(0,0,0,0.2)"}`, background: agreed ? C.blue : C.white, display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.15s", flexShrink: 0 }}>

          </div>
        </div>
      </div>
    </div>
  );
}

            <Btn size="sm" style={{ borderRadius: 980, fontSize: 12, padding: "4px 14px" }}>+ 직접 초대</Btn>
          </div>

            { label: "총 지원자", value: PANEL_APPLICANTS.length, color: C.black },

          })}
        </div>
      </main>
    </div>
  );
}

                  <span style={{ fontSize: 14, fontWeight: 600, color: job.expert ? C.ruby : C.successText, letterSpacing: -0.224 }}>🎁 {job.reward}</span>
                </div>

                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
                  {job.conditions.map(c => <Badge key={c} variant="purple">{c}</Badge>)}

                <div style={{ marginBottom: 16 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ fontSize: 12, color: C.body, letterSpacing: -0.12 }}>모집 현황</span>

                    <div style={{ height: "100%", width: `${pct}%`, background: pct >= 80 ? C.ruby : C.blue, borderRadius: 2, transition: "width 0.5s" }} />

                <div style={{ marginTop: "auto" }}>

                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

                      <Btn full size="md" onClick={() => go("interview")} style={{ borderRadius: 980 }}>지금 인터뷰 시작하기</Btn>
                    </div>
                  ) : (
                    <>
                      <Btn full variant={cfg.variant} size="sm" disabled={status !== "none"} onClick={handleApply} style={{ borderRadius: 980 }}>{cfg.label(job.reward)}</Btn>
                      {cfg.statusBadge && (
                        <div style={{ marginTop: 10, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>

                            <span style={{ fontSize: 12, color: cfg.statusBadge.color, fontWeight: 400, letterSpacing: -0.12 }}>{cfg.statusBadge.text}</span>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
                            {[["지원", "applied"], ["AI검토", "ai_screening"], ["확정", "confirmed"]].map(([lbl, st], i) => {
                              const stepIdx = APPLY_STEPS.indexOf(st);
                              const curIdx = APPLY_STEPS.indexOf(status);
                              const done = curIdx >= stepIdx;
                              return (
                                <div key={st} style={{ display: "flex", alignItems: "center", gap: 3 }}>

function WaveAnimation({ active }) {
  const bars = [3, 5, 8, 6, 4, 9, 7, 5, 8, 4, 6, 9, 5, 7, 4];
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 3, height: 32 }}>

        <div key={i} style={{ width: 3, borderRadius: 2, background: active ? C.blueLight : "rgba(255,255,255,0.15)", height: active ? `${h * 3}px` : "4px", transition: `height ${0.3 + i * 0.03}s ease-in-out`, animation: active ? `wave-${i % 3} 0.${7 + i % 4}s ease-in-out infinite alternate` : "none" }} />

  );
}

function InterviewScreen({ go }) {
  const [qIndex, setQIndex] = useState(0);
  const [phase, setPhase] = useState("ai_speaking");
  const [recordTime, setRecordTime] = useState(0);
  const [completed, setCompleted] = useState(false);
  const [reviewResult, setReviewResult] = useState(null);
  const [activeScreen, setActiveScreen] = useState(0);
  const timerRef = useRef(null);
  const MIN_RECORD_SECS = 8;
  const q = QUESTIONS[qIndex];

  useEffect(() => {
    if (phase === "ai_speaking") { const t = setTimeout(() => setPhase("ready"), 3200); return () => clearTimeout(t); }
    if (phase === "ai_review") {
      const t = setTimeout(() => {
        if (recordTime < MIN_RECORD_SECS) { setReviewResult("short"); setPhase("review_fail"); }
        else { setReviewResult("pass"); setPhase("review_pass"); }
      }, 2200);
      return () => clearTimeout(t);
    }
    if (phase === "review_pass") {
      const t = setTimeout(() => {
        if (qIndex < QUESTIONS.length - 1) { setQIndex(qi => qi + 1); setPhase("ai_speaking"); setRecordTime(0); setActiveScreen(0); setReviewResult(null); }
        else setCompleted(true);
      }, 1400);
      return () => clearTimeout(t);
    }
  }, [phase, qIndex, recordTime]);

  useEffect(() => {
    if (phase === "recording") timerRef.current = setInterval(() => setRecordTime(t => t + 1), 1000);
    else clearInterval(timerRef.current);
    return () => clearInterval(timerRef.current);
  }, [phase]);

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const stopAndReview = () => { clearInterval(timerRef.current); setPhase("ai_review"); };
  const reRecord = () => { setRecordTime(0); setReviewResult(null); setPhase("ready"); };
  const hasVisual = !!q.visual;

  if (completed) {
    return (
      <div style={{ minHeight: "100vh", background: C.pureBlack, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 40, fontFamily: F }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ width: 64, height: 64, borderRadius: "50%", background: C.successBg, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 24px", fontSize: 28 }}>✓</div>
          <div style={{ fontSize: 40, fontWeight: 600, color: C.white, letterSpacing: -0.8, lineHeight: 1.1, marginBottom: 12 }}>인터뷰 완료!</div>
          <div style={{ fontSize: 21, fontWeight: 400, color: "rgba(255,255,255,0.45)", marginBottom: 24, lineHeight: 1.19, letterSpacing: -0.42 }}>소중한 의견 감사합니다.<br />AI가 답변을 검토한 후 리워드가 지급됩니다.</div>
          <Badge variant="success" style={{ padding: "8px 16px", fontSize: 14, marginBottom: 32 }}>🎁 리워드 AI 검토 후 지급 예정</Badge>
          <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
            <PillLink onClick={() => go("panel_board")} dark>모집 보드</PillLink>
            <Btn onClick={() => { setQIndex(0); setPhase("ai_speaking"); setCompleted(false); setRecordTime(0); }} style={{ borderRadius: 980 }}>다시 체험</Btn>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: C.pureBlack, display: "flex", flexDirection: "column", fontFamily: F }}>
      {/* Progress */}
      <div style={{ padding: "18px 32px 0" }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <BackBtn onClick={() => go("panel_board")} label="나가기" dark />
              <span style={{ fontSize: 12, color: "rgba(255,255,255,0.3)", letterSpacing: -0.12 }}>앱 사용성 인터뷰 Q2</span>
            </div>
            <span style={{ fontSize: 12, color: "rgba(255,255,255,0.3)", letterSpacing: -0.12 }}>{qIndex + 1} / {QUESTIONS.length}</span>
          </div>
          <div style={{ height: 2, background: "rgba(255,255,255,0.08)", borderRadius: 1 }}>
            <div style={{ height: "100%", width: `${((qIndex + (phase !== "ai_speaking" ? 0.5 : 0)) / QUESTIONS.length) * 100}%`, background: C.blue, borderRadius: 1, transition: "width 0.5s ease" }} />
          </div>
        </div>
      </div>

      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: "28px 32px" }}>

            <div style={{ flex: "0 0 280px", display: "flex", flexDirection: "column", gap: 12 }}>

                      <button key={i} onClick={() => setActiveScreen(i)}

              <div>

              )}

              {phase === "review_pass" && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, color: "rgba(52,199,89,0.8)", letterSpacing: -0.224 }}>
                  <span>✓</span><span>답변이 확인되었습니다. 다음 질문으로 이동합니다...</span>
                </div>
              )}

              {phase === "recording" && (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 3, height: 36 }}>
                    {Array.from({ length: 22 }).map((_, i) => (
                      <div key={i} style={{ width: 3, borderRadius: 2, background: recordTime < MIN_RECORD_SECS ? "rgba(255,59,48,0.6)" : C.ruby, height: `${4 + Math.random() * 26}px`, transition: "height 0.1s" }} />
                    ))}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 14, color: "rgba(255,59,48,0.8)", letterSpacing: -0.224 }}>● {fmt(recordTime)}</span>
                    {recordTime < MIN_RECORD_SECS && <span style={{ fontSize: 12, color: "rgba(255,159,10,0.7)", letterSpacing: -0.12 }}>최소 {MIN_RECORD_SECS - recordTime}초 더</span>}
                  </div>
                </div>
              )}

              {(phase === "ready" || phase === "recording") && (
                <button onClick={() => phase === "ready" ? setPhase("recording") : stopAndReview()}
                  style={{ width: 68, height: 68, borderRadius: "50%", border: "none", cursor: "pointer", background: phase === "recording" ? C.ruby : C.blue, boxShadow: phase === "recording" ? `0 0 0 8px rgba(255,59,48,0.15)` : `0 0 0 8px rgba(0,113,227,0.15)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, transition: "all 0.25s" }}>
                  {phase === "recording" ? "⏹" : "🎤"}
                </button>
              )}

              {phase === "ready" && (
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 14, color: "rgba(255,255,255,0.45)", marginBottom: 4, letterSpacing: -0.224 }}>버튼을 눌러 답변을 시작하세요</div>
                  <div style={{ fontSize: 12, color: "rgba(255,255,255,0.2)", letterSpacing: -0.12 }}>최소 {MIN_RECORD_SECS}초 이상 · 최대 {q.duration}초</div>
                </div>
              )}
              {phase === "ai_speaking" && <div style={{ fontSize: 14, color: "rgba(255,255,255,0.25)", letterSpacing: -0.224 }}>AI가 질문을 읽고 있습니다...</div>}
            </div>
          </div>
        </div>
      </div>

      <div style={{ textAlign: "center", padding: "12px 24px 20px" }}>
        <span style={{ fontSize: 12, color: "rgba(255,255,255,0.12)", letterSpacing: -0.12 }}>답변은 암호화 저장 · AI 품질 검토 후 리워드 지급</span>
      </div>
    </div>
  );
}
